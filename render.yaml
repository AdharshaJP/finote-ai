services:
  - type: web
    name: finote-backend
    runtime: node
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false

  - type: web
    name: finote-ai
    runtime: python
    buildCommand: pip install -r ai_service/requirements.txt
    startCommand: uvicorn ai_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
